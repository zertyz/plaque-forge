name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    runs-on: ubuntu-24.04
    outputs:
      needs_analysis: ${{ steps.scope.outputs.needs_analysis }}
      needs_ml_analysis: ${{ steps.scope.outputs.needs_ml_analysis }}
      needs_ml_runtime: ${{ steps.scope.outputs.needs_ml_runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect analysis-affecting changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/analysis_change_scope.sh "$BASE_SHA" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  code-gate:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            binutils \
            clang \
            coreutils \
            diffutils \
            ffmpeg \
            fontconfig \
            grep \
            lld \
            noto-fonts \
            opencv \
            pkgconf \
            python \
            python-numpy \
            python-pillow \
            git \
            rust \
            sed
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

      - name: Run deterministic code gate
        run: ./scripts/check.sh

      # check.sh builds every target with --all-features, so the debug binary
      # already carries embedded media; the checks below reuse it instead of
      # recompiling the whole dependency graph on a separate runner.
      - name: Exercise embedded listings against repository truth
        run: |
          binary=target/debug/plaque-forge
          # Every style program is listed, and nothing else.
          diff <(ls styles/*.toml | sed -e 's|styles/||' -e 's|\.toml$||' | sort) \
               <($binary list styles | sed 's/^  //' | sort)
          # Curated fonts lead, marked, in curated_fonts order.
          test "$(head -n 1 < <($binary list fonts))" = "  *NotoSerif-Regular"
          # Plaque metadata comes straight from the catalog.
          test "$($binary list plaques | wc -l)" -eq "$(grep -c '^\[\[plaques\]\]' assets/plaques/catalog.toml)"

      - name: Prove a bundled workflow materializes and consumes its media
        env:
          PLAQUE_FORGE_BUNDLE_CACHE: ${{ runner.temp }}/bundle-cache
        run: |
          binary=target/debug/plaque-forge
          # The analysis cache arrives from inside the binary, so --if-needed
          # must succeed purely on materialized data plus installed tools.
          $binary analyze \
            --input assets/moving-holographic-plaque.mp4 \
            --source-is-text-free --if-needed
          test -f "$PLAQUE_FORGE_BUNDLE_CACHE/assets/analysis/moving-holographic-plaque/manifest.toml"
          # Style programs reference textures relative to their own file inside
          # the mirror; rendering one proves textures materialize with them.
          $binary render \
            --input assets/moving-holographic-plaque.mp4 \
            --font fonts/NotoSerif-Regular.ttf \
            --style-file styles/texture-mapped.toml \
            --text 'bundled gate' \
            --output "$PLAQUE_FORGE_BUNDLE_CACHE/gate-render.mkv" \
            --progress never
          test -f "$PLAQUE_FORGE_BUNDLE_CACHE/assets/textures/gilded-marble.png"

  dependency-audit:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the dependency scanner
        run: |
          pacman -Syu --noconfirm --needed clang rust pkgconf git
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          cargo install cargo-audit --locked --root /usr/local

      - name: Reject new RustSec findings
        run: ./scripts/audit_dependencies.sh

  homologation-gate:
    needs: code-gate
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install render dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            clang \
            ffmpeg \
            fontconfig \
            noto-fonts \
            opencv \
            pkgconf \
            git \
            rust
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

      - name: Render and enforce homologated behavior
        run: ./scripts/check_homologated_assets.sh

      - name: Retain homologation failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: homologation-failure-${{ github.run_id }}
          path: |
            output/regressions/
            output/*.homologation.json
            output/*.decision-trace.json
            output/*.render-manifest.json
            output/homologation-coverage.json
          if-no-files-found: ignore

  analysis-no-ml-gate:
    needs: [code-gate, change-scope]
    if: needs.change-scope.outputs.needs_analysis == 'true'
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install analysis dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            clang \
            ffmpeg \
            opencv \
            pkgconf \
            git \
            rust

      - name: Exercise captured pure-Rust analysis regressions
        run: ./scripts/check_analysis_regressions.sh

      - name: Retain analysis failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: analysis-no-ml-failure-${{ github.run_id }}
          path: /tmp/plaque-forge/failures/
          if-no-files-found: ignore

  segmentation-runtime-gate:
    needs: change-scope
    if: needs.change-scope.outputs.needs_ml_runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"

      - name: Restore pinned CPU segmentation runtime
        uses: actions/cache@v4
        with:
          path: /tmp/plaque-forge-python
          key: segmentation-runtime-cpu-v1-${{ runner.os }}-${{ hashFiles('scripts/setup_segmentation.sh', 'tools/segmentation-requirements.txt') }}

      - name: Build or verify the complete ML runtime
        run: ./scripts/setup_segmentation.sh --torch-profile cpu

      - name: Prove the completed runtime is offline-capable
        run: ./scripts/setup_segmentation.sh --verify --torch-profile cpu
