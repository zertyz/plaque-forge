name: Validate generated analysis commit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-analysis-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang ffmpeg fontconfig fonts-noto-core libclang-dev libopencv-dev pkg-config python3 python3-numpy python3-pil

      - name: Install Rust
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.89.0

      - name: Validate generated commit independently
        run: |
          ./scripts/check.sh
          ./scripts/check_homologated_assets.sh
