name: Validate generated analysis commit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-analysis-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            clang ffmpeg fontconfig noto-fonts opencv pkgconf python python-numpy python-pillow git rustup

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Validate generated commit independently
        run: |
          ./scripts/check.sh
          ./scripts/check_homologated_assets.sh
