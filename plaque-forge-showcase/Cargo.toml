[package]
name = "plaque-forge-showcase"
version = "0.10.0"
edition = "2024"
description = "Interactive showcase for plaque-forge textual rendering"
license = "MIT"

[dependencies]
anyhow = "1.0"
plaque-forge = { path = ".." }
egui = "0.32"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.32", features = ["image", "all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.8"
