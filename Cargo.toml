[package]
name = "plaque-forge"
version = "0.7.0"
edition = "2024"
rust-version = "1.89"
description = "Analyze, render, and verify moving title plaques in video"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
cosmic-text = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }
opencv = { version = "0.99", default-features = false, features = [
  "clang-runtime",
  "calib3d",
  "features2d",
  "geometry",
  "imgcodecs",
  "imgproc",
  "photo",
  "video",
  "videoio",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "1.0"

[dev-dependencies]
approx = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
