[package]
name = "plaque-forge"
version = "0.10.0"
edition = "2024"
description = "Analyze, render, and verify moving title plaques in video"
license = "MIT"

[features]
# Embed the repository media (videos, analysis caches, scenes, styles,
# plaques, textures, curated fonts) so listings and workflows read only
# internal data plus system fonts. Produces a large binary; off by default.
bundle-media = []
showcase = ["dep:egui", "dep:eframe", "dep:egui_extras"]

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
cosmic-text = "0.19"
egui = { version = "0.32", optional = true }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
egui_extras = { version = "0.32", features = ["image", "all_loaders"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }
opencv = { version = "0.100", default-features = false, features = [
  "clang-runtime",
  "calib3d",
  "features2d",
  "geometry",
  "imgcodecs",
  "imgproc",
  "photo",
  "video",
  "videoio",
] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
toml = "1.0"
unicode-script = "0.5"

[dev-dependencies]
approx = "0.5"

[[bin]]
name = "plaque-forge-showcase"
path = "src/bin/showcase.rs"
required-features = ["showcase"]

[build-dependencies]
anyhow = "1.0"
sha2 = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
