# Authored scene intent. Generated trajectories and ML masks live in assets/analysis.
format = "plaque-forge.scene/1"
source = "../../16_9_swamp_wooden_plaque.mp4"
default_surface = "main"

[[surfaces]]
id = "main"
space = "scene-plane"
depth = "automatic"
reference_frame = 10
bounds = [342.0, 50.0, 606.0, 193.0]

[surfaces.writable_region]
shape = "rounded-rect"
bounds = [382.0, 92.0, 486.0, 115.0]
radius = 18.0

# Moss and thorny vines are attached to the plaque but remain in front of its wood.
# The lizard moves independently across that same foreground plane. Sparse semantic
# prompts establish depth; the generated lossless alpha sequence remains analysis data.
[[layers]]
id = "plaque-foreground"
role = "foreground"
surface = "main"
in_front_of = "main"
affects_layout = false

[[layers.prompts]]
frame = 10
coordinates = "source-pixels"
object = "moss"
# Sample the fuzzy moss itself, away from the adjacent vines and moving lizard.
positive_points = [[390.0, 72.0], [560.0, 62.0], [760.0, 72.0], [420.0, 220.0]]
negative_points = [[610.0, 125.0], [700.0, 180.0]]

