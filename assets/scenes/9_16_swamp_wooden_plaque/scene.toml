# Authored scene intent. Generated trajectories and ML masks live in assets/analysis.
format = "plaque-forge.scene/1"
source = "../../9_16_swamp_wooden_plaque.mp4"
default_surface = "main"

[[surfaces]]
id = "main"
space = "scene-plane"
depth = "automatic"
reference_frame = 10
bounds = [0.0, 64.0, 720.0, 380.0]

[surfaces.writable_region]
shape = "rounded-rect"
bounds = [55.0, 105.0, 610.0, 290.0]
radius = 30.0

# The plaque-attached vegetation and independently moving lizard are foreground
# material, not wood texture. The ML artifact is regenerated from these sparse cues.
[[layers]]
id = "plaque-foreground"
role = "foreground"
surface = "main"
in_front_of = "main"
affects_layout = false

