# Authored scene intent. Generated trajectories and ML masks live in assets/analysis.
format = "plaque-forge.scene/1"
source = "../../9_16_dungeon_spider_iron_plaque.mp4"
default_surface = "main"

[[surfaces]]
id = "main"
space = "scene-plane"
depth = "automatic"
reference_frame = 10
bounds = [128.0, 159.0, 464.0, 280.0]

[surfaces.writable_region]
shape = "rounded-rect"
bounds = [160.0, 190.0, 401.0, 215.0]
radius = 22.0

# The spider itself is opaque scene material and must always be restored above
# typography. Keep it out of tracking: the automatic depth path remains responsible
# for the translucent web, while this authored layer prevents the spider body/legs
# from being treated as part of the writing plane or painted over by the title.
[[layers]]
id = "spider"
role = "foreground"
surface = "main"
in_front_of = "main"
active_frames = [116, 205]
affects_layout = false
affects_tracking = false
matte = { mode = "opaque", support_threshold = 0.03, solid_threshold = 0.20 }

