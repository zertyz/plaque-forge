# The iron face is the title's physical writing surface. This lossless, per-frame
# support matte limits material-point tracking to the plaque; it is deliberately
# not used as a deforming outline or as a substitute for the rigid four-corner
# plane. Negative evidence on the moving web and spider keeps foreground detail
# from being mistaken for plaque texture during the difficult second half.
[[layers]]
id = "iron-writing-surface"
role = "writing-surface"
surface = "main"
affects_layout = false

[[layers.prompts]]
frame = 10
coordinates = "source-pixels"
object = "iron-writing-surface"
# Unobstructed plate: an exact semantic seed is materially stronger than asking
# a box/three points to distinguish this low-contrast iron face from dark stone.
polygon = [[145.0, 159.0], [280.0, 159.0], [300.0, 180.0], [440.0, 180.0], [462.0, 159.0], [575.0, 159.0], [592.0, 176.0], [592.0, 421.0], [575.0, 439.0], [145.0, 439.0], [128.0, 421.0], [128.0, 176.0]]

