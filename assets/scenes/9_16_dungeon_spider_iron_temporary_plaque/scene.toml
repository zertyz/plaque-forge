# Authored scene intent. Generated trajectories and ML masks live in assets/analysis.
format = "plaque-forge.scene/1"
source = "../../9_16_dungeon_spider_iron_temporary_plaque.mp4"
default_surface = "main"

[[surfaces]]
id = "main"
space = "scene-plane"
depth = "automatic"
reference_frame = 10
bounds = [143.0, 173.0, 435.0, 253.0]

[surfaces.writable_region]
shape = "rounded-rect"
bounds = [161.0, 192.0, 399.0, 215.0]
radius = 22.0

# Reviewed rigid-board poses. The board starts stationary and retracts upward as a
# physical plane. The authored instrument housing below owns most of the physical
# clipping, but a light late-stage visibility taper prevents the last fragments of
# title from re-emerging above the housing while the board clears the mechanism.
# The late anchors also carry a slight scale taper so the retracting board does not
# appear to grow while it disappears behind the mechanism.
[[surfaces.anchors]]
frame = 0
coordinates = "source-pixels"
quad = [[143.0, 173.0], [578.0, 173.0], [578.0, 426.0], [143.0, 426.0]]
locked = true
visibility = 1.0
