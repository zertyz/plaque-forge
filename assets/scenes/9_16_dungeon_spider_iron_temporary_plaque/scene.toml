# Authored scene intent. Generated analysis artifacts live in assets/analysis.
format = "plaque-forge.scene/1"
source = "../../9_16_dungeon_spider_iron_temporary_plaque.mp4"
default_surface = "main"

[[surfaces]]
id = "main"
space = "scene-plane"
depth = "automatic"
reference_frame = 10
bounds = [143.0, 173.0, 435.0, 253.0]
trajectory = "trajectory.toml"

[surfaces.writable_region]
shape = "rounded-rect"
bounds = [161.0, 192.0, 399.0, 215.0]
radius = 22.0

[[layers]]
id = "instrument-housing"
role = "foreground"
surface = "main"
in_front_of = "main"
artifact = "instrument-housing/artifact.toml"
active_frames = [32, 71]
affects_layout = false
# Reviewed render-only mechanical occluder. It clips the retracting title but
# cannot perturb the now-dense reviewed plaque trajectory.
affects_tracking = false
matte = { mode = "opaque", support_threshold = 0.03, solid_threshold = 0.20 }
