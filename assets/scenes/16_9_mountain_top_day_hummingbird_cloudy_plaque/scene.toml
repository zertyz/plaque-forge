# The late green hummingbird is a distinct object in front of the cloud plane.
# It first enters from the right near frame 121, crosses the writable region, and
# then leaves it upward. Keeping this semantic object separate from the cloud
# prevents its cast shadow from being treated as solid foreground material.
[[layers]]
id = "crossing-hummingbird"
role = "foreground"
surface = "main"
affects_layout = false
active_frames = [128, 239]

