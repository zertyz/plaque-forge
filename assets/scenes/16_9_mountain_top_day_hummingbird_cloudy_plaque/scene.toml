# Authored scene intent. Generated trajectories and ML masks live in assets/analysis.
format = "plaque-forge.scene/1"
source = "../../16_9_mountain_top_day_hummingbird_cloudy_plaque.mp4"
default_surface = "main"

[[surfaces]]
id = "main"
space = "scene-plane"
depth = "declared-only"
reference_frame = 10
bounds = [229.0, 36.0, 838.0, 190.0]

[surfaces.writable_region]
shape = "rounded-rect"
bounds = [250.0, 55.0, 796.0, 155.0]
radius = 48.0

# The cloud face is the title's physical writing surface. Its lossless source-pixel
# alpha sequence constrains material-point selection and depth on every frame. The
# tracker derives rigid four-corner motion from those material points, not from the
# cloud's naturally breathing outer silhouette.
[[layers]]
id = "cloud-writing-surface"
role = "writing-surface"
surface = "main"
affects_layout = false

[[layers.prompts]]
frame = 10
coordinates = "source-pixels"
object = "cloud-writing-surface"
box_bounds = [170.0, 18.0, 940.0, 205.0]
positive_points = [[300.0, 110.0], [640.0, 105.0], [990.0, 105.0]]
negative_points = [[105.0, 105.0], [1170.0, 105.0], [640.0, 260.0]]

[[layers.prompts]]
frame = 80
coordinates = "source-pixels"
object = "cloud-writing-surface"
box_bounds = [190.0, 12.0, 925.0, 205.0]
positive_points = [[315.0, 100.0], [650.0, 100.0], [990.0, 100.0]]
negative_points = [[105.0, 100.0], [1180.0, 100.0], [650.0, 245.0]]

[[layers.prompts]]
frame = 140
coordinates = "source-pixels"
object = "cloud-writing-surface"
box_bounds = [145.0, 12.0, 960.0, 230.0]
positive_points = [[270.0, 110.0], [600.0, 110.0], [700.0, 115.0]]
# The late third hummingbird crosses in front of the cloud. Explicit background
# points on its body and wing prevent it from becoming surface geometry.
negative_points = [[80.0, 100.0], [900.0, 200.0], [1015.0, 160.0], [1180.0, 120.0], [640.0, 270.0]]

[[layers.prompts]]
frame = 200
coordinates = "source-pixels"
object = "cloud-writing-surface"
box_bounds = [0.0, 12.0, 970.0, 245.0]
positive_points = [[120.0, 115.0], [460.0, 120.0], [820.0, 135.0]]
negative_points = [[815.0, 55.0], [1040.0, 145.0], [500.0, 285.0]]

[[layers.prompts]]
frame = 239
coordinates = "source-pixels"
object = "cloud-writing-surface"
box_bounds = [0.0, 12.0, 910.0, 255.0]
positive_points = [[120.0, 120.0], [430.0, 125.0], [770.0, 145.0]]
negative_points = [[735.0, 55.0], [980.0, 175.0], [480.0, 300.0]]

# Reviewed late foreground evidence. This authored mask sequence is intentionally
# render/tracking evidence rather than a semantic object identity: it captures the
# foreground material that actually crosses the cloud, including the ogre hat and
# the late hummingbird. Keeping it authored avoids temporal ML flicker.
[[layers]]
id = "late-foreground"
role = "foreground"
surface = "main"
in_front_of = "main"
artifact = "late-foreground/artifact.toml"
active_frames = [120, 239]
affects_layout = false
affects_tracking = true
matte = { mode = "opaque", support_threshold = 0.03, solid_threshold = 0.20 }
