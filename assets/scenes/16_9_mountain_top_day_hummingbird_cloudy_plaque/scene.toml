# The late third hummingbird crosses in front of the cloud. Explicit background
# points on its body and wing prevent it from becoming surface geometry.
negative_points = [[80.0, 100.0], [900.0, 200.0], [1015.0, 160.0], [1180.0, 120.0], [640.0, 270.0]]

