# Authored scene intent. Generated trajectories and ML masks live in assets/analysis.
format = "plaque-forge.scene/1"
source = "../../16_9_mountain_top_day_hummingbird_cloudy_plaque.mp4"
default_surface = "main"

[[surfaces]]
id = "main"
space = "scene-plane"
depth = "declared-only"
reference_frame = 10
bounds = [229.0, 36.0, 838.0, 190.0]

[surfaces.writable_region]
shape = "rounded-rect"
bounds = [250.0, 55.0, 796.0, 155.0]
radius = 48.0

# The cloud face is the title's physical writing surface. Its lossless source-pixel
# alpha sequence constrains material-point selection and depth on every frame. The
# tracker derives rigid four-corner motion from those material points, not from the
# cloud's naturally breathing outer silhouette.
[[layers]]
id = "cloud-writing-surface"
role = "writing-surface"
surface = "main"
affects_layout = false

[[layers.prompts]]
frame = 10
coordinates = "source-pixels"
object = "cloud-writing-surface"
box_bounds = [170.0, 18.0, 940.0, 205.0]
positive_points = [[300.0, 110.0], [640.0, 105.0], [990.0, 105.0]]
negative_points = [[105.0, 105.0], [1170.0, 105.0], [640.0, 260.0]]

