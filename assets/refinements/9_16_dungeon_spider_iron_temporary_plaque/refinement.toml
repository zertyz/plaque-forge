# The opaque instrument housing descends in front of the retracting board. Its
# internal screen and gears are part of the housing, not holes through which title
# lettering should remain visible. A semantic foreground layer supplements the
# automatic thin-web/spider matte during only the crossing interval.
[[layers]]
id = "instrument-housing"
role = "foreground"
plaque = "main"
in_front_of = "main"
artifact = "instrument-housing/artifact.toml"
affects_layout = false
